; Per-tier quality and level-of-detail scaling. These add to the engine's built-in Android and iOS
; profiles; the engine picks the tier from the device's GPU. Tune the numbers on real hardware
; with "stat unit" and "stat gpu" until each tier holds 60 fps on your map.
;
; r.MobileContentScaleFactor      render resolution
; r.SkeletalMeshLODBias           +1 uses one LOD lower for every character
; r.StaticMeshLODDistanceScale    >1 switches environment LODs sooner
; r.ViewDistanceScale             <1 culls small props sooner
; fx.Niagara.QualityLevel         picks cheaper emitters in effects that define quality levels

[Android_High DeviceProfile]
+CVars=t.MaxFPS=60
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.SkeletalMeshLODBias=0
+CVars=r.StaticMeshLODDistanceScale=1.0
+CVars=r.ViewDistanceScale=1.0
+CVars=r.ShadowQuality=3
+CVars=fx.Niagara.QualityLevel=3

[Android_Mid DeviceProfile]
+CVars=t.MaxFPS=60
+CVars=r.MobileContentScaleFactor=0.85
+CVars=r.SkeletalMeshLODBias=1
+CVars=r.StaticMeshLODDistanceScale=1.5
+CVars=r.ViewDistanceScale=0.8
+CVars=r.ShadowQuality=2
+CVars=r.MSAACount=2
+CVars=fx.Niagara.QualityLevel=2

[Android_Low DeviceProfile]
+CVars=t.MaxFPS=30
+CVars=r.MobileContentScaleFactor=0.7
+CVars=r.SkeletalMeshLODBias=2
+CVars=r.StaticMeshLODDistanceScale=2.0
+CVars=r.ViewDistanceScale=0.6
+CVars=r.ShadowQuality=0
+CVars=r.MSAACount=1
+CVars=fx.Niagara.QualityLevel=1

[IOS DeviceProfile]
+CVars=t.MaxFPS=60
+CVars=r.MobileContentScaleFactor=2.0
+CVars=r.SkeletalMeshLODBias=0
+CVars=r.StaticMeshLODDistanceScale=1.0
+CVars=fx.Niagara.QualityLevel=3
