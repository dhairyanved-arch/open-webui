; Project settings that matter for this game. Open Project Settings in the editor to confirm
; each one took effect for your engine build; the editor adds the rest of this file itself.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/TacShooter.TacGameMode
; Set GameDefaultMap / ServerDefaultMap to your level once it exists.

; ---------------------------------------------------------------------------------------------
; Landscape only
; ---------------------------------------------------------------------------------------------

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
Orientation=SensorLandscape
bFullScreen=True
bBuildForArm64=True
bSupportsVulkan=True
bBuildForES31=True

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
bSupportsMetal=True
FrameRateLock=PUFRL_60

; ---------------------------------------------------------------------------------------------
; Mobile rendering: forward shading, baked lighting, MSAA
; ---------------------------------------------------------------------------------------------

[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=0
r.MobileHDR=True
r.Mobile.AntiAliasing=3
r.MSAACount=4
r.AllowStaticLighting=True
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.AllowMovableDirectionalLights=False
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.AmbientOcclusion=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False

; ---------------------------------------------------------------------------------------------
; Bullet impact surfaces. Assign a physical material with one of these to each map material
; and map it to an effect in the weapon's ImpactEffects.
; ---------------------------------------------------------------------------------------------

[/Script/Engine.PhysicsSettings]
+PhysicalSurfaces=(Type=SurfaceType1,Name="Stone")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Metal")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Wood")

; ---------------------------------------------------------------------------------------------
; Netcode: 60 Hz server
; ---------------------------------------------------------------------------------------------

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000
