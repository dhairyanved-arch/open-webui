<title>Nightburn Racing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;1,600;1,700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,500;0,600;1,700&display=swap">
<style>
/* Layout: full-bleed WebGL stage; slanted motorsport panels pinned to the screen corners, thumbs own the bottom edge */
:root{
  color-scheme:dark;
  --night:#0a0718; --ink:#150e2b; --panel:rgba(14,9,32,.74); --line:rgba(255,255,255,.16);
  --text:#f5f1ff; --dim:#b0a8cf;
  --hot:#ff2e7e; --volt:#19e3ff; --amber:#ffb400; --amber-ink:#231400;
  --display:'Chakra Petch','Trebuchet MS',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  --skew:-12deg;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
h1,h2,h3,p{margin:0}

#app{position:fixed;inset:0;overflow:hidden;background:var(--night);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));pointer-events:none}
#stage{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;pointer-events:none}
.screen>*{pointer-events:auto}

/* ---------- shared pieces ---------- */
.eyebrow{font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--volt)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top-actions{display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:var(--panel);border:1px solid var(--line);
  transform:skewX(var(--skew));font-family:var(--num);font-weight:600;font-size:20px;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip>*{transform:skewX(calc(var(--skew) * -1))}
.chip .cr{width:12px;height:12px;background:var(--amber);transform:rotate(45deg);box-shadow:0 0 10px var(--amber)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transform:skewX(var(--skew))}
.icon-btn svg{width:20px;height:20px;transform:skewX(calc(var(--skew) * -1));fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:rgba(255,255,255,.18)}
.btn{position:relative;min-height:52px;padding:0 26px;font-family:var(--display);font-style:italic;font-weight:700;font-size:20px;letter-spacing:.06em;
  text-transform:uppercase;transform:skewX(var(--skew));border:1px solid var(--line);background:var(--panel);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .08s,filter .08s}
.btn>span{display:inline-flex;align-items:baseline;gap:10px;transform:skewX(calc(var(--skew) * -1))}
.btn small{font-family:var(--num);font-style:normal;font-weight:500;font-size:14px;letter-spacing:.08em;color:var(--dim)}
.btn:active{transform:skewX(var(--skew)) scale(.96);filter:brightness(1.25)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:transparent;box-shadow:0 0 28px rgba(255,180,0,.45),inset 0 -4px 0 rgba(0,0,0,.18)}
.btn.primary small{color:rgba(35,20,0,.7)}
.btn.hot{background:var(--hot);color:#fff;border-color:transparent;box-shadow:0 0 26px rgba(255,46,126,.45)}
.btn.sm{min-height:44px;padding:0 18px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.arrow{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.06);transform:skewX(var(--skew))}
.arrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.arrow:active{background:rgba(255,255,255,.2)}

/* ---------- home ---------- */
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(34px,7.2vw,64px);line-height:.9;letter-spacing:.01em;
  text-shadow:0 0 30px rgba(255,46,126,.55)}
.brand h1 em{color:var(--hot);font-style:italic}
.brand p{font-family:var(--num);font-weight:600;letter-spacing:.42em;text-transform:uppercase;font-size:13px;color:var(--volt);padding-left:3px}
.home-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--hot);padding:12px 14px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);min-width:0}
.track-card{flex:1 1 280px;max-width:430px;display:flex;flex-direction:column;gap:8px}
.track-card .row{display:flex;align-items:center;gap:12px}
.trk-info{flex:1;min-width:0;text-align:center}
.trk-info h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk-info p{font-family:var(--num);font-weight:500;font-size:15px;letter-spacing:.06em;color:var(--dim);font-variant-numeric:tabular-nums}
.home-cta{display:flex;gap:16px;align-items:stretch;flex:0 1 auto;padding-right:8px}
.home-cta .primary{min-width:150px;min-height:60px;font-size:26px}
.keys{font-family:var(--num);font-size:13px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;display:none}
@media (hover:hover) and (pointer:fine){.keys{display:block}}

/* ---------- garage ---------- */
#garage{justify-content:space-between}
.gar-panel{align-self:flex-end;width:min(100%,400px);display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--volt);padding:14px 16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gar-head{display:flex;align-items:center;gap:10px}
.gar-title{flex:1;min-width:0;text-align:center}
.gar-head h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.stats{display:grid;gap:7px}
.stat{display:grid;grid-template-columns:92px 1fr 40px;white-space:nowrap;align-items:center;gap:10px;font-family:var(--num);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat b{color:var(--text);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.bar{height:7px;background:rgba(255,255,255,.12);transform:skewX(-24deg);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--hot),var(--amber));transition:width .35s cubic-bezier(.2,.8,.2,1)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),inset 0 5px 8px rgba(255,255,255,.3)}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--volt),inset 0 -6px 10px rgba(0,0,0,.35),inset 0 5px 8px rgba(255,255,255,.3)}
.gar-panel .btn{width:100%}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--num)}
#hud>*{position:absolute}
.hud-tl{left:0;top:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pos{display:flex;align-items:baseline;gap:2px;padding:2px 16px 2px 12px;background:linear-gradient(90deg,var(--panel),transparent);border-left:3px solid var(--amber);
  font-style:italic;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.pos b{font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
.pos sup{font-size:18px;letter-spacing:.04em;align-self:flex-start;margin-top:6px}
.pos span{font-size:20px;color:var(--dim);margin-left:4px}
.lap{font-weight:600;font-size:17px;letter-spacing:.12em;padding-left:15px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.lap b{color:var(--amber)}
.hud-tc{left:50%;top:0;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#hudTime{font-weight:600;font-size:26px;letter-spacing:.05em;font-variant-numeric:tabular-nums}
#hudBest{font-size:13px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud-tr{right:0;top:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hud-tr .icon-btn{pointer-events:auto}
#minimap{width:104px;height:104px;opacity:.95;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.hud-bc{left:50%;bottom:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-shadow:0 2px 12px rgba(0,0,0,.75)}
.speed{display:flex;align-items:baseline;gap:6px;font-style:italic;font-weight:700}
.speed b{font-size:58px;line-height:.95;min-width:2.1ch;text-align:right;font-variant-numeric:tabular-nums}
.speed span{font-size:14px;letter-spacing:.16em;color:var(--dim);font-style:normal;font-weight:600}
.gear{font-weight:600;font-size:13px;letter-spacing:.2em;color:var(--volt)}
#hudMsg{left:50%;top:21%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(22px,5vw,38px);
  letter-spacing:.05em;text-transform:uppercase;opacity:0;text-shadow:0 0 22px currentColor,0 3px 8px rgba(0,0,0,.6)}
#hudMsg.show{animation:msg 1.5s cubic-bezier(.2,.9,.2,1) both}
#hudMsg.volt{color:var(--volt)} #hudMsg.hot{color:var(--hot)} #hudMsg.amber{color:var(--amber)}
@keyframes msg{0%{opacity:0;transform:translateX(-50%) scale(1.5) skewX(-10deg)}14%{opacity:1;transform:translateX(-50%) scale(1) skewX(-10deg)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px) skewX(-10deg)}}
#wrongWay{left:50%;top:36%;transform:translateX(-50%);padding:6px 18px;background:var(--hot);color:#fff;font-family:var(--display);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.1em;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#countdown{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(90px,26vw,190px);line-height:1;
  color:#fff;text-shadow:0 0 50px var(--hot),0 6px 0 rgba(0,0,0,.35);pointer-events:none;opacity:0}
#countdown.tick{animation:tick .85s cubic-bezier(.2,.9,.2,1) both}
#countdown.go{color:var(--amber);text-shadow:0 0 60px var(--amber),0 6px 0 rgba(0,0,0,.35)}
@keyframes tick{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.82)}}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none}
#steerZone{position:absolute;left:-16px;top:18%;bottom:-12px;width:54%;pointer-events:none}
#touch.slide #steerZone{pointer-events:auto}
#touch.slide .steer{display:none}
#slideHint{position:absolute;left:0;bottom:22px;width:150px;height:56px;border:1px dashed rgba(255,255,255,.35);border-radius:28px;display:none;place-items:center;
  font-family:var(--num);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
#touch.slide #slideHint{display:grid}
#slideKnob{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5)}
.tbtn{position:absolute;pointer-events:auto;display:grid;place-items:center;border-radius:50%;background:rgba(12,8,28,.42);border:1.5px solid rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);touch-action:none;transition:background .06s,transform .06s}
.tbtn svg{width:42%;height:42%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tbtn.on{background:rgba(255,255,255,.3);transform:scale(.94)}
.steer{bottom:14px;width:var(--tb);height:var(--tb)}
#tLeft{left:0} #tRight{left:calc(var(--tb) + 12px)}
#tNitro{right:0;bottom:14px;width:calc(var(--tb) * 1.14);height:calc(var(--tb) * 1.14);border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#tNitro .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--volt) calc(var(--n,0) * 1%),rgba(255,255,255,.18) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}
#tNitro .core{position:absolute;inset:9px;border-radius:50%;display:grid;place-items:center;background:rgba(10,30,48,.55);border:1.5px solid rgba(25,227,255,.6);
  font-family:var(--display);font-style:italic;font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--volt)}
#tNitro.ready .core{box-shadow:0 0 22px rgba(25,227,255,.55),inset 0 0 14px rgba(25,227,255,.35)}
#tNitro.burn .core{background:var(--volt);color:#04222b;box-shadow:0 0 34px var(--volt)}
#tNitro.on{transform:scale(.94)}
#tDrift{right:calc(var(--tb) * 1.14 + 12px);bottom:14px;width:calc(var(--tb) * .9);height:calc(var(--tb) * .9);
  font-family:var(--display);font-style:italic;font-weight:700;font-size:13px;letter-spacing:.08em;border-color:rgba(255,46,126,.75);color:#ffd1e2}
#tDrift.on{background:rgba(255,46,126,.55)}
#touch{--tb:72px}
#app.narrow .brand h1{font-size:29px}
#app.narrow .brand p{font-size:11px;letter-spacing:.3em}
#app.narrow .top-actions{gap:6px}
#app.narrow .top-actions .icon-btn{width:40px;height:40px}
#app.narrow .chip{height:40px;padding:0 10px;font-size:17px}
#app.narrow .home-cta{flex:1 1 100%;padding:0 8px;gap:12px}
#app.narrow .home-cta .btn{flex:1;padding:0 10px;min-width:0}
#app.narrow .home-cta .primary{min-width:0}
#app.narrow #homeCar{display:none}
#app.narrow .track-card{max-width:none}
#app.narrow #touch{--tb:62px}
#app.narrow .speed b{font-size:46px}
#app.narrow .hud-bc{bottom:calc(var(--tb,62px) + 34px)}
#app.narrow #minimap{width:84px;height:84px}
#app.narrow .pos b{font-size:42px}
#app.short #minimap{width:84px;height:84px}
#app.short .speed b{font-size:48px}
#app.short .gar-panel{gap:7px;padding:10px 14px;width:min(100%,360px)}
#app.short .stats{gap:3px}
#app.short .swatch{width:28px;height:28px}
#app.short .gar-panel .btn{min-height:44px;font-size:17px}
#app.short .gar-head h2{font-size:20px}
#app.narrow.short .hud-bc{bottom:4px}
#app.short .sheet{width:min(100%,640px);gap:9px;padding:12px 16px}
#app.short .sheet h2{font-size:20px}
#app.short .opts{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
#app.short .opt{min-height:40px}
#app.short .seg button{min-height:34px;min-width:44px;padding:0 9px;font-size:13px}
#app.short .sheet-actions{flex-direction:row}
#app.short .sheet-actions .btn{flex:1;min-height:44px;padding:0 10px;font-size:15px}
#app.short .res-place b{font-size:42px}
#app.short .rows{gap:3px;font-size:15px;grid-template-columns:1fr 1fr;column-gap:24px}
#app.short .rows div{padding-bottom:3px}
#app.short .rows .total{grid-column:1 / -1}
/* landscape mode on an upright phone: the whole stage is turned a quarter turn */
#app.rot{inset:auto;top:0;left:100%;transform-origin:0 0;transform:rotate(90deg)}
#app.rot #ui{padding-left:max(16px,env(safe-area-inset-top,0px));padding-right:max(16px,env(safe-area-inset-bottom,0px));padding-block:max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-left,0px))}
#app.rot .overlay{padding:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-top,0px))}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(6,3,16,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:auto;overflow:auto}
.sheet{width:min(100%,430px);display:flex;flex-direction:column;gap:14px;background:var(--ink);border:1px solid var(--line);border-top:3px solid var(--hot);padding:18px}
.sheet h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-weight:500}
.opt span{color:var(--dim)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{min-width:58px;min-height:40px;padding:0 12px;font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--volt);color:#04222b}
.sheet-actions{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.res-place{display:flex;align-items:baseline;gap:12px}
.res-place b{font-family:var(--display);font-style:italic;font-weight:700;font-size:64px;line-height:.9;color:var(--amber);text-shadow:0 0 30px rgba(255,180,0,.5)}
.res-place span{font-family:var(--num);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.rows{display:grid;gap:6px;font-family:var(--num);font-size:17px;letter-spacing:.05em}
.rows div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:5px}
.rows span{color:var(--dim);text-transform:uppercase;font-size:14px;letter-spacing:.12em}
.rows b{font-weight:600;font-variant-numeric:tabular-nums}
.rows .total b{color:var(--amber);font-size:22px}
#loading{background:var(--night)}
.load-box{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.load-box h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(28px,7vw,48px);text-transform:uppercase;letter-spacing:.04em}
.load-bar{width:220px;height:5px;background:rgba(255,255,255,.14);transform:skewX(-24deg);overflow:hidden}
.load-bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--hot),var(--amber));animation:load 1s linear infinite}
@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(270%)}}
#fatal{padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){#hudMsg.show,#countdown.tick{animation-duration:.01s;opacity:1}.load-bar i{animation:none}}
</style>
